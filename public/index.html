<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SoundScope — Music Reviews</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; background:#0b0c10; color:#eee; }
    header { padding: 16px; border-bottom: 1px solid #222; position: sticky; top:0; background:#0b0c10; z-index:10; }
    .brand { font-weight: 700; font-size: 20px; letter-spacing: .5px; }
    .controls { display:flex; gap:8px; margin-top:10px; }
    input, select, button, textarea { padding:10px; border-radius:10px; border:1px solid #333; background:#111; color:#eee; }
    input::placeholder, textarea::placeholder { color:#888; }
    main { padding: 16px; max-width: 1100px; margin: 0 auto; }
    .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap:14px; margin-top: 16px; }
    .card { background:#111; border:1px solid #222; border-radius:16px; overflow:hidden; box-shadow: 0 10px 20px rgba(0,0,0,.25); }
    .card img { width: 100%; height: 180px; object-fit: cover; display:block; }
    .card .p { padding: 12px; }
    .muted { color:#aaa; font-size: 13px; }
    .pill { display:inline-block; padding:4px 10px; border-radius:999px; background:#1f2937; font-size:12px; }
    .album-detail { margin-top: 24px; display:grid; grid-template-columns: 280px 1fr; gap:18px; }
    .album-detail img { width: 100%; border-radius:16px; border:1px solid #222; }
    .reviews { margin-top: 12px; display:flex; flex-direction:column; gap:12px; }
    .review { background:#111; border:1px solid #222; border-radius:16px; padding:12px; }
    .stars { letter-spacing:2px; }
    .divider { height:1px; background:#222; margin:18px 0; }
    .success { color:#8ff09b; }
  </style>
</head>
<body>
  <header>
    <div class="brand">SoundScope</div>
    <div class="controls">
      <input id="q" placeholder="Search artist or album…" />
      <select id="genre">
        <option value="">All genres</option>
        <option>Pop</option><option>Rock</option><option>Hip-Hop</option>
        <option>R&B</option><option>Electronic</option><option>Jazz</option>
      </select>
      <select id="sort">
        <option value="">Sort: default</option>
        <option value="rating">Top rated</option>
        <option value="newest">Newest</option>
      </select>
      <button id="apply">Apply</button>
    </div>
  </header>

  <main>
    <div id="albums" class="grid"></div>
    <div id="detail"></div>
  </main>

  <script src="./app.js"></script>
</body>
</html>
